<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>feature.json viewer</title>
   <meta name="description" content="Read a feature.json in the browser: steps, statuses, dependency graph by track, requirements. Reloads when the file changes.">
   <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E">
   <link rel="stylesheet" href="viewer.css">
   <script>
      try {
         const theme = localStorage.getItem('fjv-theme');
         if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
   </script>
   <script type="module" src="js/main.js"></script>
</head>
<body>
   <div class="chrome" id="chrome">
      <header class="topbar">
         <button class="brand" data-action="home" title="Back to the start screen"><span class="brand-mark" aria-hidden="true">{ }</span><span class="brand-name">feature.json</span></button>
         <div class="file-info" id="file-info"></div>
         <div class="actions">
            <button class="btn" data-action="open">Open…</button>
            <details class="menu" id="recent-menu" hidden>
               <summary class="btn">Recent</summary>
               <div class="menu-body" id="recent-body"></div>
            </details>
            <button class="btn icon-only" id="theme-btn" data-action="theme">◐</button>
         </div>
      </header>
      <nav class="tabs" id="tabs" role="tablist" hidden></nav>
   </div>
   <div class="banner" id="banner" role="status" hidden></div>
   <main class="app" id="app"></main>
   <div class="drop-overlay" id="drop-overlay" hidden><div>Drop <code>feature.json</code> to open it</div></div>
   <input type="file" id="file-input" accept=".json,application/json" hidden>
</body>
</html>
